name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
          cache: false

      - name: Install Lefthook
        run: go install github.com/evilmartians/lefthook/v2@v2.1.14

      - name: Set up Just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - name: Run tests
        run: just test